name: Cloud worker lease
description: Acquire or release this GitHub run's independent lease on the declared GCE worker.
inputs:
  operation:
    description: acquire or release
    required: true
  minutes:
    description: Maximum lease duration
    default: '300'
  project:
    description: GCP installation project
    required: true
  instance:
    description: GCE worker instance
    required: true
  zone:
    description: GCE worker zone
    required: true
  provider:
    description: Workload identity provider
    required: true
  service-account:
    description: Cloud control service account
    required: true
runs:
  using: composite
  steps:
    - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
      with:
        workload_identity_provider: ${{ inputs.provider }}
        service_account: ${{ inputs.service-account }}
    - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
    - name: Acquire or release this run's lease
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        INSTANCE: ${{ inputs.instance }}
        ZONE: ${{ inputs.zone }}
        OPERATION: ${{ inputs.operation }}
        MINUTES: ${{ inputs.minutes }}
        GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        LEASE_SCRIPT: ${{ github.action_path }}/lease.sh
      run: bash "$LEASE_SCRIPT"
