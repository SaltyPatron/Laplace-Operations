name: Cloud worker lease
on:
  workflow_call:
    inputs:
      operation:
        type: string
        required: true
      minutes:
        type: number
        default: 300
permissions:
  contents: read
  id-token: write
jobs:
  lease:
    # The lease is taken and released from the staging runner, as Laplace-Native's
    # cloud-lease.yml does; the cloud worker itself may be stopped.
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: Laplace-Operations
      - uses: ./Laplace-Operations/cloud
        with:
          operation: ${{ inputs.operation }}
          minutes: ${{ inputs.minutes }}
          project: ${{ vars.LAPLACE_GCP_PROJECT }}
          instance: ${{ vars.LAPLACE_CLOUD_INSTANCE }}
          zone: ${{ vars.LAPLACE_CLOUD_ZONE }}
          provider: ${{ vars.LAPLACE_GCP_WIF_PROVIDER }}
          service-account: ${{ vars.LAPLACE_GCP_SERVICE_ACCOUNT }}
