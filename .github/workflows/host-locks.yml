name: Inspect host lock owners
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read kernel and live descriptor ownership as the deployment identity
        run: python3 installation/host-locks.py --configuration installation/hart-server-modular.json --output "$RUNNER_TEMP/host-locks.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: host-locks-${{ github.run_id }}
          path: ${{ runner.temp }}/host-locks.json
          if-no-files-found: error
          retention-days: 14
