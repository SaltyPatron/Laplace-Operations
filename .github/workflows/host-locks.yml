name: Inspect host lock owners
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read kernel and live descriptor ownership as the deployment identity
        run: python3 installation/host-locks.py --configuration installation/hart-server-modular.json --output "$RUNNER_TEMP/host-locks.json"
      - name: Record host lock receipt in step summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/host-locks.json" ]; then
            {
              echo '## Host lock owners'
              echo '```json'
              cat "$RUNNER_TEMP/host-locks.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
