name: Operations workflow validation
# Explicit Linux fixture replay uses the existing Operations staging runner.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operations-workflow-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflows:
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 5
    defaults:
      run:
        working-directory: Laplace-Operations
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: Laplace-Operations
      - name: Validate workflows and the read-only auditor
        run: |
          ruby -rpsych -e 'ARGV.each { |path| Psych.parse_file(path) }' .github/workflows/*.yml
          python3 -m py_compile verify-admitted-data.py .github/scripts/resolve-dependencies.py
          bash -n deploy.sh ingest.sh operation-lock.sh workspace-code.sh
      - name: Verify unchanged prepared inputs preserve incremental builds
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          bash tests/prepared-artifacts-incremental.sh
          bash tests/deployment-artifacts.sh
