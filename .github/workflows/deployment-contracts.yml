name: Deployment failure boundaries
# Development checks run locally on HART-DESKTOP. Fixture replay is an explicit
# operator choice. The Linux jobs run on this repository's own staging runner,
# without root and in the runner's temp directory. windows-backup is the one job
# still on a GitHub-hosted image: no self-hosted Windows runner exists.
on:
  workflow_dispatch:
    inputs:
      logging_only:
        description: "Check Linux logging declarations and rotation fixtures on the staging runner, without applying host setup."
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: operations-deployment-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  logging:
    if: inputs.logging_only
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: Laplace-Operations
      - name: Verify logging declarations without changing host configuration
        working-directory: Laplace-Operations
        run: |
          set -euo pipefail
          bash -n setup.sh
          TMPDIR="$RUNNER_TEMP" bash tests/syslog-rotation.sh
          unit_root=$(mktemp -d "$RUNNER_TEMP/logging-units.XXXXXXXX")
          trap 'rm -rf -- "$unit_root"' EXIT
          mkdir "$unit_root/rsyslog.service.d"
          cp network/rsyslog-boot.conf "$unit_root/rsyslog.service.d/laplace-network.conf"
          printf '[Unit]\nDefaultDependencies=no\n[Service]\nExecStart=/usr/bin/true\n' > "$unit_root/rsyslog.service"
          printf '[Unit]\nDefaultDependencies=no\n' > "$unit_root/network-online.target"
          SYSTEMD_UNIT_PATH="$unit_root" systemd-analyze verify --man=no "$unit_root/rsyslog.service"
  configuration-index:
    if: ${{ !inputs.logging_only }}
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 5
    defaults:
      run:
        working-directory: Laplace-Operations
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: Laplace-Operations
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify source indexing and credential suppression
        run: node audit/test-configuration-index.mjs
  windows-backup:
    if: ${{ !inputs.logging_only }}
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify installed modular client input and cache selection
        run: python tests/modular-client.py
      - name: Verify Windows installer native argument boundaries
        shell: pwsh
        run: pwsh -NoProfile -File tests/windows-client-arguments.ps1
      - name: Verify staged artifacts retain inherited operator access
        run: python tests/artifact-access.py
      - name: Verify runtime audit uses its owner without remote installation
        shell: pwsh
        run: pwsh -NoProfile -File tests/application-runtime-verification.ps1
      - name: Verify running client version, ownership and release retention
        shell: pwsh
        run: pwsh -NoProfile -File tests/desktop-clients.ps1
      - name: Verify local cleanup ownership, hardlinks, references and idempotence
        shell: pwsh
        run: pwsh -NoProfile -File tests/storage.ps1
      - name: Verify desktop component ownership and explicit rebuild selection
        shell: pwsh
        run: pwsh -NoProfile -File tests/desktop-component-plan.ps1
      - name: Verify PostgreSQL installer service and recovery boundaries
        shell: pwsh
        run: pwsh -NoProfile -File tests/postgres-service-repair.ps1
      - name: Verify Zstd synthetic codec regression
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C compiler is missing' }
          & cmd.exe /d /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cl /nologo /MD /Od tests\zstd-roundtrip.c /Fe:`"$env:RUNNER_TEMP\zstd-roundtrip.exe`" /Fo:`"$env:RUNNER_TEMP\zstd-roundtrip.obj`""
          if ($LASTEXITCODE) { throw 'Zstd regression probe compilation failed' }
          $gitRoot = Split-Path (Split-Path (Get-Command git.exe).Source)
          $dll = @("$gitRoot/ucrt64/bin/libzstd.dll", "$gitRoot/mingw64/bin/libzstd.dll") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $dll) { throw 'Git Zstd runtime is missing' }
          & "$env:RUNNER_TEMP/zstd-roundtrip.exe" $dll $dll
          if ($LASTEXITCODE) { throw 'Zstd synthetic regression failed' }
      - name: Check out the application configuration contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace
          ref: aa9b512dc620ca9bf62b5afca6ac987cad9406b0
          path: .acceptance/laplace
          persist-credentials: false
      - name: Verify application component dependency and immutable-storage integration
        env:
          LAPLACE_OPERATIONS: ${{ github.workspace }}
        run: python .acceptance/laplace/scripts/test-windows-components.py
      - name: Use the application SDK for configuration evaluation
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Verify named Windows acceptance checks
        shell: pwsh
        env:
          LAPLACE_ACCEPTANCE_SOURCE: ${{ github.workspace }}/.acceptance/laplace
        run: |
          $env:LAPLACE_WORK=Join-Path $env:RUNNER_TEMP 'laplace'
          pwsh -NoProfile -File laplace.ps1 test -Check config-windows,storage-windows,resource-refusal-windows,backup-copy-windows,desktop-enrollment-storage,platform-access-resolution,operation-targets,acceptance-runner,desktop-storage-retention
      - name: Preserve Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acceptance-windows-${{ github.sha }}
          path: ${{ runner.temp }}/laplace/operations/test-*/
          if-no-files-found: error
  boundaries:
    if: ${{ !inputs.logging_only }}
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Laplace-Operations
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: Laplace-Operations
      - name: Provide the pinned PowerShell in the runner's tool cache
        run: bash .github/scripts/provide-pwsh.sh
      - name: Check deployment sequencing and failure propagation
        shell: bash
        run: |
          export TMPDIR="$RUNNER_TEMP"
          bash tests/tune-pg-plan.sh
          bash tests/agent-storage.sh
          bash tests/syslog-rotation.sh
          bash tests/machine-config.sh
          SETVARS_COMPLETED=1 OMP_NUM_THREADS=2 MKL_NUM_THREADS=3 bash -c '. ./laplace.env; test "$OMP_NUM_THREADS" = 2 && test "$MKL_NUM_THREADS" = 3'
          bash tests/operation-lock.sh
          python3 tests/host-locks.py
          bash tests/workspace-code.sh
          bash tests/ingest-wal.sh
          bash tests/deployment-artifacts.sh
          bash tests/prepared-artifacts-incremental.sh
          bash tests/modular-activation.sh
          bash tests/native-inputs.sh
          bash tests/deployment-readback.sh
          bash tests/fingerprint-comparison.sh
          ruby tests/secrets-setup.rb
          bash tests/appdb-secrets.sh
          bash tests/secrets-recovery.sh
          python3 tests/database-compatibility.py
          python3 tests/dependency-revisions.py
          python3 tests/cloud-idle.py
          python3 tests/cloud-lease.py
          python3 tests/development-database.py
          python3 tests/substrate-maintain.py
          python3 tests/host-repair.py
          python3 tests/runtime-owner.py
          python3 tests/modular-installation.py
          python3 tests/database-restart.py
          python3 tests/linux-operator.py
          python3 tests/modular-client.py
          python3 tests/client-environment.py
          python3 tests/codespaces-configuration.py
          python3 tests/storage.py
          pwsh -NoProfile -File tests/desktop-clients.ps1
          pwsh -NoProfile -File tests/deployment-artifacts.ps1
      - name: Verify acceptance result failure boundaries
        shell: pwsh
        run: pwsh -NoProfile -File tests/acceptance-runner.ps1
      - name: Verify named Linux acceptance checks
        shell: pwsh
        run: pwsh -NoProfile -File acceptance/verify.ps1 -Check config-linux,storage-linux,resource-refusal-linux,setup-default-flow,setup-resource-convergence -Output "$env:RUNNER_TEMP/acceptance-linux.json"
      - name: Preserve Linux acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acceptance-linux-${{ github.sha }}
          path: ${{ runner.temp }}/acceptance-linux.json
          if-no-files-found: error
      - name: Require the host's SQLite for backup recovery checks
        run: sqlite3 --version
      - name: Check secrets backup failure and recovery behavior
        run: TMPDIR="$RUNNER_TEMP" pwsh -NoProfile -File acceptance/verify.ps1 -Check secrets-backup-isolation -Output "$RUNNER_TEMP/acceptance-secrets-backup.json"
      - name: Preserve secrets backup acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acceptance-secrets-backup-${{ github.sha }}
          path: ${{ runner.temp }}/acceptance-secrets-backup.json
          if-no-files-found: error
