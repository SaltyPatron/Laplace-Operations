# Laplace-Operations on its runner: hart-server, the deployment target every merge to main deploys to — the developer's
# staging deployment rehearsal. Run on a push to this repository's main, and on a repository_dispatch
# (main-merged) that Laplace-Native, Laplace-postgres and Laplace-Engine send when their own CI passes on main, so the
# machine is deployed with every repository at its main. The jobs, on the one runner, one deployment at a time:
#   deploy   the reseed policy (seed-stamp.sh decide), then deploy.sh, or deploy.sh drop when the database is reseeded:
#            build/install against prepared artifacts, database schema/settings and status (no admission)
#   checks   mandatory installed extension and Engine/PostgreSQL compatibility after modular activation; no admission
#   ingest   only when run by hand with `reseed`: ingest.sh, every source of $LAPLACE_SOURCES (laplace.env), and the
#            stamp written. Deployments on a push or main-merged dispatch never ingest;
#            the run summary reports the seed-stamp policy.
#   tests    verify.sh tests: every database check of the deployed revisions (Laplace-postgres's regression cases,
#            Laplace-Engine's and Laplace-MCP's tests/deployed), against the deployed database through the deployed
#            programs and the installed extension. The components' own CI has no database; this is where their database
#            checks run. Each check works under witnesses of its own and forgets them: nothing is made, dropped or emptied
#   reads    verify.sh reads: laplace status and reads through the indexes
# The reseed policy: a database carries the stamp of the code it was seeded from (seed-stamp.sh); when Laplace-Native,
# Laplace-Engine's source or recipes, Laplace-postgres or Operations' floating-point contract change, the stamp
# changes, and the policy says the database is due a reseed. It is reported, never acted on by itself: by hand, drop
# (empty, no ingest) or reseed (drop and every source), here or in ingest.yml.
# The three code repositories are checked out beside this one (private: the secret LAPLACE_CHECKOUT); builds and work are
# the runner's own (runner/.env); the database is laplace.env's. A deployment never runs under an ingest (deploy.sh
# leaves): ingest.yml shares this workflow's concurrency group, so the two queue rather than collide.
name: Laplace-Operations
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**/*.md'
      - 'tests/**'
      - 'audit/**'
      - 'acceptance/**'
      - 'verify-admitted-data.py'
      - 'sql/verify-admitted-data.sql'
      - '**/*.ps1'
      - 'installation/package-windows-client.py'
      - 'installation/artifact_store.py'
      - 'installation/host-locks.py'
      - 'installation/hart-desktop-*.json'
      - 'development/installation.json'
      - 'components.lock.tsv'   # written by this workflow once a deployment is verified
  repository_dispatch:
    types: [main-merged]
  workflow_call:
    inputs:
      engine_revision:
        type: string
        required: false
        default: ""
      advance:
        type: boolean
        default: false
      drop:
        type: boolean
        default: false
      reseed:
        type: boolean
        default: false
      rebuild_runtime:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      engine_revision:
        description: "Optional full Engine commit already in main; its real CI must pass. Empty keeps the version lock's."
        type: string
        required: false
      advance:
        description: "Deploy every component at its main instead of the version lock (components.lock.tsv); a verified run records them there"
        type: boolean
        default: false
      drop:
        description: "drop the database and make it again, empty, before deploying (deploy.sh drop): everything in it is lost"
        type: boolean
        default: false
      reseed:
        description: "drop the database and seed it again: every source of LAPLACE_SOURCES (laplace.env; empty: every source in recipes/order)"
        type: boolean
        default: false
      rebuild_runtime:
        description: "Clean-build and verify staging native runtime, then retire previous releases. Reconnect old clients. No database reset."
        type: boolean
        default: false
concurrency:
  group: hart-server-laplace
  cancel-in-progress: false
env:
  # Cross-repository deployments coordinate on the actual host, beyond GitHub's
  # repository-local concurrency groups. Wait before touching the shared runtime.
  LAPLACE_HOST_LOCK_WAIT_SECONDS: ${{ vars.LAPLACE_HOST_LOCK_WAIT_SECONDS || '7200' }}
  LAPLACE_SRC: ${{ github.workspace }}
  LAPLACE_CONNINFO: ""   # the database is laplace.env's, never a copy a runner kept from when it was registered
  LAPLACE_RESEED: ${{ vars.LAPLACE_RESEED || 'auto' }}
permissions:
  contents: read
  id-token: write
jobs:
  resolve:
    # Only trusted main pushes, repository dispatches and explicit operations
    # enter this workflow. Orchestration uses the existing delivery runner.
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    # native-inputs.sh waits up to LAPLACE_NATIVE_WAIT (90 min) for Native's run of the resolved revision
    timeout-minutes: 100
    defaults:
      run:
        working-directory: Laplace-Operations
    outputs:
      native: ${{ steps.refs.outputs.native }}
      native_run: ${{ steps.refs.outputs.native_run }}
      postgres: ${{ steps.refs.outputs.postgres }}
      engine: ${{ steps.refs.outputs.engine }}
      mcp: ${{ steps.refs.outputs.mcp }}
      salty_suite: ${{ steps.refs.outputs.salty_suite }}
      current: ${{ steps.current.outputs.current }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: Laplace-Operations
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          repository: "${{ github.repository_owner }}/Salty-Suite"
          ref: "${{ vars.SALTY_SUITE_REF || 'main' }}"
          path: Salty-Suite
          token: "${{ secrets.LAPLACE_CHECKOUT }}"
      - name: Verify immutable revision and prepared input selection
        run: python3 tests/dependency-revisions.py
      - name: Resolve immutable dependency revisions
        id: refs
        env:
          GH_TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
        run: python3 .github/scripts/resolve-dependencies.py
      # Every run deploys the version lock (a merged component's dispatch replaces only its own row), so a run whose
      # revisions are already deployed and verified (the tests job records them) has nothing to do. A manual dispatch
      # always runs.
      - name: Are these exact revisions already deployed and verified?
        id: current
        env:
          EVENT: ${{ github.event_name }}
          KEY: "operations=${{ github.sha }} native=${{ steps.refs.outputs.native }} postgres=${{ steps.refs.outputs.postgres }} engine=${{ steps.refs.outputs.engine }} mcp=${{ steps.refs.outputs.mcp }} salty_suite=${{ steps.refs.outputs.salty_suite }}"
        run: |
          . ./laplace.env
          record="$LAPLACE_WORK/deployed-revisions"
          if [ "$EVENT" != workflow_dispatch ] && [ "$EVENT" != workflow_call ] && [ -f "$record" ] && [ "$(cat "$record")" = "$KEY" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Already deployed and verified: $KEY; nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
  qualify-engine:
    needs: resolve
    if: needs.resolve.outputs.current != 'true'
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 90
    outputs:
      superseded: ${{ steps.qualify.outputs.superseded }}
    defaults:
      run:
        working-directory: Laplace-Operations
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: Laplace-Operations
      - name: Require the selected Engine revision to build and pass its tests
        id: qualify
        env:
          GH_TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
          ENGINE_SHA: ${{ needs.resolve.outputs.engine }}
        run: python3 .github/scripts/resolve-dependencies.py qualify-engine "$ENGINE_SHA"
  deploy:
    needs: [resolve, qualify-engine]
    # a superseded Engine revision yields to the deployment its successor's push starts
    if: needs.qualify-engine.outputs.superseded != 'true'
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 240
    outputs:
      ingest: ${{ steps.policy.outputs.ingest }}
      native: ${{ steps.revisions.outputs.native }}
      native_run: ${{ needs.resolve.outputs.native_run }}
      postgres: ${{ steps.revisions.outputs.postgres }}
      engine: ${{ steps.revisions.outputs.engine }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, path: Laplace-Operations }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, repository: "${{ github.repository_owner }}/Laplace-Native", ref: "${{ needs.resolve.outputs.native }}", path: Laplace-Native, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, repository: "${{ github.repository_owner }}/Laplace-postgres", ref: "${{ needs.resolve.outputs.postgres }}", path: Laplace-postgres, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, repository: "${{ github.repository_owner }}/Laplace-Engine", ref: "${{ needs.resolve.outputs.engine }}", path: Laplace-Engine, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - name: Record dependency revisions for cloud
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          for item in native:Laplace-Native postgres:Laplace-postgres engine:Laplace-Engine; do
            key=${item%%:*}; repo=${item#*:}
            sha=$(git -C "$repo" rev-parse --verify HEAD)
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            echo "$key=$sha" >> "$GITHUB_OUTPUT"
            echo "- $repo: $sha" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, repository: "${{ github.repository_owner }}/Laplace-MCP", ref: "${{ needs.resolve.outputs.mcp }}", path: Laplace-MCP, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, repository: "${{ github.repository_owner }}/Salty-Suite", ref: "${{ needs.resolve.outputs.salty_suite }}", path: Salty-Suite, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - name: the reseed policy
        id: policy
        env:
          DROP: ${{ inputs.drop }}
          RESEED: ${{ inputs.reseed }}
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_REPOSITORY: ${{ github.event.client_payload.repository }}
          TRIGGER_SHA: ${{ github.event.client_payload.sha }}
        run: |
          GITHUB_OUTPUT= ./Laplace-Operations/seed-stamp.sh decide > policy.txt; cat policy.txt
          drop=$(sed -n 's/^drop=//p' policy.txt); ingest=$(sed -n 's/^ingest=//p' policy.txt); why=$(sed -n 's/^why=//p' policy.txt)
          if [ "$RESEED" = true ]; then drop=true ingest=true why="dispatched with reseed: dropped, and every source seeded again"
          elif [ "$DROP" = true ]; then drop=true ingest=false why="dispatched with drop: made again empty, no ingest"
          else why="$why; a deployment ingests only when dispatched with reseed: drop $drop, ingest $ingest were called for, neither is done"; drop=false; ingest=false; fi
          echo "drop=$drop" >> "$GITHUB_OUTPUT"; echo "ingest=$ingest" >> "$GITHUB_OUTPUT"
          { echo "## hart-server: the deployment"; echo
            echo "- triggered by: $TRIGGER_EVENT $TRIGGER_REPOSITORY $TRIGGER_SHA"
            echo "- reseed policy (LAPLACE_RESEED=$LAPLACE_RESEED): drop $drop, ingest $ingest: $why"; echo
            echo '```'; ./Laplace-Operations/seed-stamp.sh show; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Receive the canonical caches verified for the selected Native revision
        env:
          GH_TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
          NATIVE_SHA: ${{ needs.resolve.outputs.native }}
          NATIVE_RUN: ${{ needs.resolve.outputs.native_run }}
        run: |
          dest="${RUNNER_TEMP:?}/native-prepared-inputs"
          rm -rf "$dest" && mkdir -p "$dest"
          shared_dir="${LAPLACE_BUILD%/agents/*}/native-prepared-inputs/$NATIVE_SHA"
          if [[ -d "$shared_dir" ]]; then
            cp -a --reflink=auto --no-preserve=ownership "$shared_dir/." "$dest/"
          else
            gh run download "$NATIVE_RUN" --repo SaltyPatron/Laplace-Native --name native-prepared-inputs --dir "$dest"
          fi
      - name: Provide the pinned Rust compiler for recipe grammar generation
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.90.0
      - name: build/install prepared artifacts and deploy database infrastructure
        env:
          DROP: ${{ steps.policy.outputs.drop }}
          LAPLACE_PREPARED_INPUTS: ${{ runner.temp }}/native-prepared-inputs
        run: |
          if [ "$DROP" = true ]; then ./Laplace-Operations/deploy.sh drop; else ./Laplace-Operations/deploy.sh; fi
      - name: a database dropped for a reseed carries the stamp it is being seeded to
        if: steps.policy.outputs.drop == 'true' && steps.policy.outputs.ingest == 'true'
        run: ./Laplace-Operations/seed-stamp.sh pending
      - name: Deploy and verify the installed modular runtime
        env:
          REBUILD_RUNTIME: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.rebuild_runtime == true }}
        run: |
          arguments=()
          if [[ "$REBUILD_RUNTIME" == true ]]; then arguments+=(--rebuild); fi
          python3 ./Laplace-Operations/installation/modular.py deploy --source "$GITHUB_WORKSPACE" "${arguments[@]}"
      - name: Clean owned modular deployment outputs
        if: always()
        uses: ./Laplace-Operations/storage
        with:
          finish-job: 'false'
          receipt: ${{ runner.temp }}/storage.json
      - name: Retain deployment cleanup evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-staging-${{ github.run_id }}
          path: ${{ runner.temp }}/storage.json
          if-no-files-found: warn
          retention-days: 1
  checks:
    needs: deploy
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, path: Laplace-Operations, clean: false }
      - name: Verify deployed extension and artifact compatibility
        run: ./Laplace-Operations/verify.sh deployment
  ingest:
    needs: [deploy, checks]
    if: always() && needs.deploy.result == 'success' && needs.checks.result == 'success' && needs.deploy.outputs.ingest == 'true'
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 7200
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, path: Laplace-Operations, clean: false }
      - name: the ingest, its status, and its measurements
        run: ./Laplace-Operations/ingest.sh
      - name: the database holds the stamp it was seeded from
        run: ./Laplace-Operations/seed-stamp.sh seeded
  tests:
    needs: [resolve, deploy, checks, ingest]
    if: always() && needs.deploy.result == 'success' && needs.checks.result == 'success' && needs.ingest.result != 'failure' && needs.ingest.result != 'cancelled'
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, path: Laplace-Operations, clean: false }
      # The checks are the deployed revisions' own: the same commits deploy built and installed.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, repository: "${{ github.repository_owner }}/Laplace-postgres", ref: "${{ needs.deploy.outputs.postgres }}", path: Laplace-postgres, token: "${{ secrets.LAPLACE_CHECKOUT }}", clean: false }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, repository: "${{ github.repository_owner }}/Laplace-Engine", ref: "${{ needs.deploy.outputs.engine }}", path: Laplace-Engine, token: "${{ secrets.LAPLACE_CHECKOUT }}", clean: false }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, repository: "${{ github.repository_owner }}/Laplace-MCP", ref: "${{ needs.resolve.outputs.mcp }}", path: Laplace-MCP, token: "${{ secrets.LAPLACE_CHECKOUT }}", clean: false }
      - name: the database checks of the deployed revisions, against the deployed database
        run: ./Laplace-Operations/verify.sh tests
      - name: Record the revisions this deployment verified
        env:
          KEY: "operations=${{ github.sha }} native=${{ needs.resolve.outputs.native }} postgres=${{ needs.resolve.outputs.postgres }} engine=${{ needs.resolve.outputs.engine }} mcp=${{ needs.resolve.outputs.mcp }} salty_suite=${{ needs.resolve.outputs.salty_suite }}"
        run: |
          . ./Laplace-Operations/laplace.env
          printf '%s' "$KEY" > "$LAPLACE_WORK/deployed-revisions.tmp" && mv "$LAPLACE_WORK/deployed-revisions.tmp" "$LAPLACE_WORK/deployed-revisions"
      # The version lock moves only here: to the set this deployment built, installed and verified. Its commit is
      # excluded from the push trigger, so recording it deploys nothing.
      - name: Advance the version lock to the verified revisions
        working-directory: Laplace-Operations
        env:
          TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 .github/scripts/resolve-dependencies.py write-lock native=${{ needs.resolve.outputs.native }} \
            postgres=${{ needs.resolve.outputs.postgres }} engine=${{ needs.resolve.outputs.engine }} mcp=${{ needs.resolve.outputs.mcp }} salty_suite=${{ needs.resolve.outputs.salty_suite }}
          git diff --quiet -- components.lock.tsv && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Version lock: the revisions staging verified (run ${{ github.run_id }})" -- components.lock.tsv
          remote="https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          for attempt in 1 2 3; do
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              pull -q --rebase "$remote" main && git push -q "$remote" HEAD:main && exit 0
            sleep 10
          done
          echo "::error::the version lock could not be pushed"; exit 1
  reads:
    needs: [deploy, checks, ingest]
    if: always() && needs.deploy.result == 'success' && needs.checks.result == 'success' && needs.ingest.result != 'failure' && needs.ingest.result != 'cancelled'
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, path: Laplace-Operations, clean: false }
      - name: the database, read
        run: ./Laplace-Operations/verify.sh reads
