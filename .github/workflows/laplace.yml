# Laplace-Operations on its runner: the deployment (deploy.sh: the server's settings, the build, the perf-caches,
# the database's schema and extension, and its status). Settings are tune-pg.sh, as the role: the runner has no root.
# Volumes, packages, kernel and access stay setup.sh, run by a person. On a push, or when
# someone runs it; run by hand with drop, the database is dropped and made again, empty, by the role before it is
# deployed. No data is loaded: the ingest is a workflow of its own (ingest.yml). The three code repositories are
# checked out beside this one (private: the secret LAPLACE_CHECKOUT); builds and work are the runner's own
# (runner/.env); the database is the machine's. A deployment never runs under an ingest: deploy.sh leaves.
name: Laplace-Operations
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      drop:
        description: "drop the database and make it again, empty, before deploying (deploy.sh drop): everything in it is lost"
        type: boolean
        default: false
env:
  LAPLACE_SRC: ${{ github.workspace }}
  LAPLACE_CONNINFO: ""   # the database is laplace.env's, never a copy a runner kept from when it was registered
jobs:
  deploy:
    runs-on: [self-hosted, laplace, Laplace-Operations]
    steps:
      - uses: actions/checkout@v4
        with: { path: Laplace-Operations }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Native", path: Laplace-Native, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-postgres", path: Laplace-postgres, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Engine", path: Laplace-Engine, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - name: the build, the perf-caches, the database with its schema and extension, and its status
        env:
          DROP: ${{ inputs.drop }}
        run: |
          if [ "$DROP" = true ]; then ./Laplace-Operations/deploy.sh drop; else ./Laplace-Operations/deploy.sh; fi
