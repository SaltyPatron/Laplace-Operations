# Laplace-Operations on its runner: hart-server, the deployment target every merge to main deploys to — the developer's
# staging deployment rehearsal. Run on a push to this repository's main, and on a repository_dispatch
# (main-merged) that Laplace-Native, Laplace-postgres and Laplace-Engine send when their own CI passes on main, so the
# machine is deployed with every repository at its main. The jobs, on the one runner, one deployment at a time:
#   deploy   the reseed policy (seed-stamp.sh decide), then deploy.sh, or deploy.sh drop when the database is reseeded:
#            build/install against prepared artifacts, database schema/settings and status (no admission)
#   checks   verify.sh build: the build's record (tier 0 and flags made afresh, the highway, the claims of
#            $LAPLACE_DETERMINISM decomposed twice), against HART-DESKTOP's record for the same commits; no database
#   ingest   only when run by hand with `reseed`: ingest.sh, every source of $LAPLACE_SOURCES (laplace.env), and the
#            stamp written. A deployment on a push or a main-merged dispatch never ingests (the inventor, 2026-10-09:
#            a build is not an ingest); the policy still says what the stamp calls for, in the run's summary
#   reads    verify.sh reads: laplace status and reads through the indexes
# The reseed policy: a database carries the stamp of the code it was seeded from (seed-stamp.sh); when Laplace-Native,
# Laplace-Engine's source or recipes, Laplace-postgres or Operations' floating-point contract change, the stamp
# changes, and the policy says the database is due a reseed. It is reported, never acted on by itself: by hand, drop
# (empty, no ingest) or reseed (drop and every source), here or in ingest.yml.
# The three code repositories are checked out beside this one (private: the secret LAPLACE_CHECKOUT); builds and work are
# the runner's own (runner/.env); the database is laplace.env's. A deployment never runs under an ingest (deploy.sh
# leaves): ingest.yml shares this workflow's concurrency group, so the two queue rather than collide.
name: Laplace-Operations
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [main-merged]
  workflow_dispatch:
    inputs:
      drop:
        description: "drop the database and make it again, empty, before deploying (deploy.sh drop): everything in it is lost"
        type: boolean
        default: false
      reseed:
        description: "drop the database and seed it again: every source of LAPLACE_SOURCES (laplace.env; empty: every source in recipes/order)"
        type: boolean
        default: false
      production:
        description: "after staging has passed in this run: deploy the same revisions to hart-cloud (production) and lay its record beside hart-server's"
        type: boolean
        default: false
concurrency:
  group: hart-server-laplace
  cancel-in-progress: false
env:
  LAPLACE_SRC: ${{ github.workspace }}
  LAPLACE_CONNINFO: ""   # the database is laplace.env's, never a copy a runner kept from when it was registered
  LAPLACE_RESEED: ${{ vars.LAPLACE_RESEED || 'auto' }}
jobs:
  deploy:
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 240
    outputs:
      ingest: ${{ steps.policy.outputs.ingest }}
      native: ${{ steps.revisions.outputs.native }}
      postgres: ${{ steps.revisions.outputs.postgres }}
      engine: ${{ steps.revisions.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with: { path: Laplace-Operations }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Native", ref: main, path: Laplace-Native, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-postgres", ref: main, path: Laplace-postgres, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Engine", ref: main, path: Laplace-Engine, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - name: Record dependency revisions for production
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          for item in native:Laplace-Native postgres:Laplace-postgres engine:Laplace-Engine; do
            key=${item%%:*}; repo=${item#*:}
            sha=$(git -C "$repo" rev-parse --verify HEAD)
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            echo "$key=$sha" >> "$GITHUB_OUTPUT"
            echo "- $repo: $sha" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: the reseed policy
        id: policy
        env:
          DROP: ${{ inputs.drop }}
          RESEED: ${{ inputs.reseed }}
        run: |
          GITHUB_OUTPUT= ./Laplace-Operations/seed-stamp.sh decide > policy.txt; cat policy.txt
          drop=$(sed -n 's/^drop=//p' policy.txt); ingest=$(sed -n 's/^ingest=//p' policy.txt); why=$(sed -n 's/^why=//p' policy.txt)
          if [ "$RESEED" = true ]; then drop=true ingest=true why="dispatched with reseed: dropped, and every source seeded again"
          elif [ "$DROP" = true ]; then drop=true ingest=false why="dispatched with drop: made again empty, no ingest"
          else why="$why; a deployment ingests only when dispatched with reseed: drop $drop, ingest $ingest were called for, neither is done"; drop=false; ingest=false; fi
          echo "drop=$drop" >> "$GITHUB_OUTPUT"; echo "ingest=$ingest" >> "$GITHUB_OUTPUT"
          { echo "## hart-server: the deployment"; echo
            echo "- triggered by: ${{ github.event_name }} ${{ github.event.client_payload.repository }} ${{ github.event.client_payload.sha }}"
            echo "- reseed policy (LAPLACE_RESEED=$LAPLACE_RESEED): drop $drop, ingest $ingest: $why"; echo
            echo '```'; ./Laplace-Operations/seed-stamp.sh show; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: the build, the perf-caches, the database with its schema and extension, and its status
        env:
          DROP: ${{ steps.policy.outputs.drop }}
        run: |
          if [ "$DROP" = true ]; then ./Laplace-Operations/deploy.sh drop; else ./Laplace-Operations/deploy.sh; fi
      - name: a database dropped for a reseed carries the stamp it is being seeded to
        if: steps.policy.outputs.drop == 'true' && steps.policy.outputs.ingest == 'true'
        run: ./Laplace-Operations/seed-stamp.sh pending
  checks:
    needs: deploy
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: Laplace-Operations, clean: false }
      - name: Verify local repeatability and compare build records
        env:
          LAPLACE_FINGERPRINT_TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
        run: ./Laplace-Operations/verify.sh build
  ingest:
    needs: [deploy, checks]
    if: always() && needs.deploy.result == 'success' && needs.deploy.outputs.ingest == 'true'
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 7200
    steps:
      - uses: actions/checkout@v4
        with: { path: Laplace-Operations, clean: false }
      - name: the ingest, its status, and its measurements
        run: ./Laplace-Operations/ingest.sh
      - name: the database holds the stamp it was seeded from
        run: ./Laplace-Operations/seed-stamp.sh seeded
  reads:
    needs: [deploy, ingest]
    if: always() && needs.deploy.result == 'success' && needs.ingest.result != 'failure' && needs.ingest.result != 'cancelled'
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: Laplace-Operations, clean: false }
      - name: the database, read
        run: ./Laplace-Operations/verify.sh reads
  # Production: hart-cloud (a Google Compute c3, Sapphire Rapids: AVX-512 and its VNNI, which hart-server's processor
  # lacks), its runner labelled production, after the staging deployment and its checks have passed, and after the
  # production environment's reviewer has approved. The same revisions, deployed by the same script; its own checks
  # lay its build's record beside hart-server's for the same commits, so a difference between the AVX2 machine and
  # the AVX-512 machine is a failure here. Its ingest, only when the run was dispatched with `reseed` too, takes the
  # sources its own declaration names (LAPLACE_SOURCES in /etc/laplace/machine.env, fetched from their publishers by
  # data.sh), then the reads.
  # The gate is the dispatch itself: production deploys only when this workflow is run by hand with `production`
  # set (a private repository has no reviewer rule on an environment), and only once staging has passed in that run.
  deploy-production:
    needs: [deploy, checks]
    if: always() && needs.deploy.result == 'success' && needs.checks.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.production == true
    runs-on: [self-hosted, laplace, Laplace-Operations, production]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { path: Laplace-Operations }
      - name: Require the dependency revisions checked in staging
        shell: bash
        env:
          NATIVE: ${{ needs.deploy.outputs.native }}
          POSTGRES: ${{ needs.deploy.outputs.postgres }}
          ENGINE: ${{ needs.deploy.outputs.engine }}
        run: |
          set -euo pipefail
          for sha in "$NATIVE" "$POSTGRES" "$ENGINE"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Missing or invalid staging revision'; exit 1; }
          done
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Native", ref: "${{ needs.deploy.outputs.native }}", path: Laplace-Native, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-postgres", ref: "${{ needs.deploy.outputs.postgres }}", path: Laplace-postgres, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Engine", ref: "${{ needs.deploy.outputs.engine }}", path: Laplace-Engine, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - name: the build, the perf-caches, the database with its schema and extension, and its status
        run: |
          { echo "## hart-cloud: the deployment"; echo; echo "- $(lscpu | sed -n 's/^Model name: *//p')"
            echo '- `'"$(grep -o -wE 'avx2|avx_vnni|avx512f|avx512_vnni|avx512_bf16|amx_tile' /proc/cpuinfo | sort -u | tr '\n' ' ')"'`'; echo; } >> "$GITHUB_STEP_SUMMARY"
          ./Laplace-Operations/deploy.sh
  checks-production:
    needs: deploy-production
    runs-on: [self-hosted, laplace, Laplace-Operations, production]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: Laplace-Operations, clean: false }
      - name: Verify local repeatability and compare build records
        env:
          LAPLACE_FINGERPRINT_TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
        run: ./Laplace-Operations/verify.sh build
  ingest-production:
    needs: [deploy-production, checks-production]
    if: always() && needs.deploy-production.result == 'success' && needs.checks-production.result == 'success' && inputs.reseed == true
    runs-on: [self-hosted, laplace, Laplace-Operations, production]
    timeout-minutes: 7200
    steps:
      - uses: actions/checkout@v4
        with: { path: Laplace-Operations, clean: false }
      - name: the ingest of this machine's sources, its status, and its measurements
        run: ./Laplace-Operations/ingest.sh
  reads-production:
    needs: [deploy-production, ingest-production]
    if: always() && needs.deploy-production.result == 'success' && needs.ingest-production.result != 'failure' && needs.ingest-production.result != 'cancelled'
    runs-on: [self-hosted, laplace, Laplace-Operations, production]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: Laplace-Operations, clean: false }
      - name: the database, read
        run: ./Laplace-Operations/verify.sh reads
