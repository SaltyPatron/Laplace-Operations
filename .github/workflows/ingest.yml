# The ingest, on the Operations runner: an operation someone starts, on the machine as the last Laplace-Operations
# run left it. It builds nothing and checks out no code: the program, the recipes, the perf-caches and the database are
# the ones that run built and deployed, so what is ingested is read by exactly what was built. One ingest per database
# at a time; a run that was cut off is taken up by running it again. With reseed, the one-click drop and full reseed:
# the database dropped and deployed again empty (deploy.sh drop, with the code the last deployment checked out), every
# source of LAPLACE_SOURCES ingested, the database stamped with what it was seeded from (seed-stamp.sh), and read.
# It shares the deployment's concurrency group (laplace.yml): an ingest and a deployment queue, never collide.
name: Laplace-Ingest
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Source names or short aliases from the installed recipe catalog; empty for every source"
        default: ""
        required: false
      reseed:
        description: "refused: reseed through laplace.yml reseed=true (laplace-ops seed staging -Yes), which also activates the release"
        type: boolean
        default: false
      repair_projection:
        description: "Repair canonical coordinates and Hilbert keys before the selected ingest; preserves content IDs and paths, incompatible with reseed"
        type: boolean
        default: false
concurrency:
  group: hart-server-laplace
  cancel-in-progress: false
env:
  LAPLACE_HOST_LOCK_WAIT_SECONDS: ${{ vars.LAPLACE_HOST_LOCK_WAIT_SECONDS || 'wait' }}
  LAPLACE_SRC: ${{ github.workspace }}
  LAPLACE_CONNINFO: ""   # the database is laplace.env's, never a copy a runner kept from when it was registered
jobs:
  ingest:
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 7200
    steps:
      - uses: actions/checkout@v4
        with: { path: Laplace-Operations, clean: false }
      # laplace-operational reads $LAPLACE_SRC/Laplace/seeds/operational (its Laplace-Engine source declaration), and
      # LAPLACE_SRC is this workspace: without the monorepo's seeds here the source was "at none of its roots" on every
      # run. Only that directory is checked out, at the monorepo's main.
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace", path: Laplace, token: "${{ secrets.LAPLACE_CHECKOUT }}",
                persist-credentials: false, sparse-checkout: seeds/operational, sparse-checkout-cone-mode: true }
      - name: Explicitly repair the installed canonical projection
        if: inputs.repair_projection
        env:
          RESEED: ${{ inputs.reseed }}
        run: |
          set -euo pipefail
          if [ "$RESEED" = true ]; then
            echo 'Select projection repair or reseed, not both.' >&2
            exit 2
          fi
          . Laplace-Operations/laplace.env
          laplace projection --apply
      - name: Provide the pinned Rust compiler for recipe grammar generation
        if: inputs.reseed
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.90.0
      - name: a reseed is the deployment's own path
        if: inputs.reseed
        run: |
          # Dropping here skipped modular activation, so the recreated database lost its cache bindings.
          echo '::error::Reseed through the deployment, which drops, deploys, activates and then ingests: laplace-ops seed staging -Yes, or gh workflow run laplace.yml --repo SaltyPatron/Laplace-Operations -f reseed=true'
          exit 2
      - name: Installed ingestion sources, aliases, content and decomposers
        run: |
          . Laplace-Operations/laplace.env
          {
            echo '## Installed ingestion catalog'
            echo '```json'
            laplace ingest --catalog
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: the ingest, its status, and its measurements
        env:
          RESEED: ${{ inputs.reseed }}
          SOURCES: ${{ inputs.sources }}
          GH_TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$RESEED" = true ]; then
            ./Laplace-Operations/ingest.sh
          elif [ "$SOURCES" = workspace-code ]; then
            ./Laplace-Operations/workspace-code.sh checkout
            ./Laplace-Operations/workspace-code.sh ingest
          else
            read -r -a selected <<< "$SOURCES"
            ./Laplace-Operations/ingest.sh "${selected[@]}"
          fi
      - name: the database holds the stamp it was seeded from
        if: inputs.reseed
        run: ./Laplace-Operations/seed-stamp.sh seeded
      - name: the database, read
        if: always()
        run: ./Laplace-Operations/verify.sh reads
