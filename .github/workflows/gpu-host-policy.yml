name: GPU host eligibility
on:
  pull_request:
    paths:
      - chess/provision.sh
      - laplace.env
      - tests/chess-gpu-policy.sh
      - .github/workflows/gpu-host-policy.yml
permissions:
  contents: read
jobs:
  refusal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash tests/chess-gpu-policy.sh
