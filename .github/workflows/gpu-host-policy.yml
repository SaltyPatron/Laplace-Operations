name: GPU host eligibility
# This exercises policy fixtures, not GPU workloads, on this repository's own staging runner. Replay is opt-in.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operations-gpu-host-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refusal:
    runs-on: [self-hosted, laplace, Laplace-Operations, staging]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: Laplace-Operations
      - run: TMPDIR="$RUNNER_TEMP" bash tests/chess-gpu-policy.sh
        working-directory: Laplace-Operations
